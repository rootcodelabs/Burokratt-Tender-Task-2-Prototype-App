services:
  ruuter-public:
    container_name: ruuter-public
    image: ruuter
    environment:
      - application.cors.allowedOrigins=http://localhost:8086,http://localhost:3003,http://localhost:3004,http://localhost:8088,http://localhost:8082
      - application.httpCodesAllowList=200,201,202,204,400,401,403,500
      - application.internalRequests.allowedIPs=127.0.0.1
      - application.logging.displayRequestContent=true
      - application.logging.displayResponseContent=true
      - application.logging.printStackTrace=true
      - application.internalRequests.disabled=true
      - server.port=8086
    volumes:
      - ./DSL/Ruuter.public:/DSL
      - ./constants.ini:/app/constants.ini
    ports:
      - 8086:8086
    networks:
      - s3-testing
    cpus: "0.5"
    mem_limit: "512M"
    
  ruuter-private:
    container_name: ruuter-private
    image: ruuter
    environment:
      - application.cors.allowedOrigins=http://localhost:8086,http://localhost:3003,http://localhost:3000,http://localhost:3004,http://localhost:4222,http://localhost:3310,http://localhost:8082,http://localhost:9000,http://localhost:9000
      - application.httpCodesAllowList=200,201,202,400,401,403,500
      - application.internalRequests.allowedIPs=127.0.0.1
      - application.logging.displayRequestContent=true
      - application.logging.displayResponseContent=true
      - application.logging.printStackTrace=true
      - application.internalRequests.disabled=true
      - server.port=8088
    volumes:
      - ./DSL/Ruuter.private:/DSL
      - ./constants.ini:/app/constants.ini
    ports:
      - 8088:8088
    networks:
      - s3-testing
    cpus: "0.5"
    mem_limit: "512M"

  s3-database:
    container_name: s3-database
    image: postgres:14.1
    environment:
      - POSTGRES_USER=s3
      - POSTGRES_PASSWORD=dbadmin
      - POSTGRES_DB=s3_db
    ports:
      - 5432:5432
    volumes:
      - ./db-data:/var/lib/postgresql/data
    networks:
      - s3-testing

  resql:
    container_name: resql
    image: resql
    depends_on:
      s3-database:
        condition: service_started
    environment:
      - sqlms.datasources.[0].name=byk
      - sqlms.datasources.[0].jdbcUrl=jdbc:postgresql://s3-database:5432/s3_db
      - sqlms.datasources.[0].username=s3
      - sqlms.datasources.[0].password=dbadmin
      - logging.level.org.springframework.boot=INFO
    ports:
      - 8082:8082
    volumes:
      - ./DSL/Resql:/DSL
      - ./shared:/shared
    networks:
      - s3-testing

  tim:
    container_name: tim
    image: tim
    depends_on:
      tim-postgresql:
        condition: service_started
    environment:
      - SECURITY_ALLOWLIST_JWT=ruuter-private,ruuter-public,resql,tim,tim-postgresql,authentication-layer,127.0.0.1,::1
      - JWT_INTEGRATION_SIGNATURE_KEY_STORE_PASSWORD=defaultpassword
    ports:
      - 8085:8085
    networks:
      - s3-testing
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cpus: "0.5"
    mem_limit: "512M"

  tim-postgresql:
    container_name: tim-postgresql
    image: postgres:14.1
    environment:
      - POSTGRES_USER=tim
      - POSTGRES_PASSWORD=123
      - POSTGRES_DB=tim
      # - POSTGRES_HOST_AUTH_METHOD=trust
    volumes:
      - ./tim-db:/var/lib/postgresql/data
    ports:
      - 9876:5432
    networks:
      - s3-testing

  authentication-layer:
    container_name: authentication-layer
    image: authentication-layer
    ports:
      - 3004:3004
    networks:
      - s3-testing

  minio:
    image: minio/minio:latest
    container_name: buerokratt-minio
    ports:
      - "9000:9000"      # API
      - "9001:9001"      # Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_SERVER_URL: http://localhost:9000
    command: server /data --console-address ":9001"
    volumes:
      - ./minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - s3-testing

  # MinIO Client - Initialize buckets on startup
  minio-init:
    image: minio/mc:latest
    container_name: buerokratt-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 10;
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/quarantined --ignore-existing;
      /usr/bin/mc mb myminio/validated --ignore-existing;
      /usr/bin/mc mb myminio/flagged --ignore-existing;
      /usr/bin/mc anonymous set download myminio/validated;
      echo 'MinIO buckets initialized successfully';
      exit 0;
      "
    networks:
      - s3-testing

  clamav:
      image: clamav/clamav:stable
      container_name: buerokratt-clamav
      ports:
        - "3310:3310"
      volumes:
        - clamav-db:/var/lib/clamav
        #- ./config/clamd.conf:/etc/clamav/clamd.conf:ro
        - ./logs/clamav:/var/log/clamav
      environment:
        - CLAMAV_NO_FRESHCLAM=false  # Ensure virus definitions update
      healthcheck:
        test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
        interval: 60s
        timeout: 30s
        retries: 3
        start_period: 120s  # Give time for initial DB load
      restart: unless-stopped
      networks:
        - s3-testing

  # NATS JetStream Message Broker
  nats:
    image: nats:alpine
    container_name: buerokratt-nats
    ports:
      - "4222:4222"      # Client connections
      - "8222:8222"      # HTTP monitoring
    command: "-js -m 8222 -sd /data"  # Enable JetStream, monitoring, and set storage directory
    volumes:
      - ./nats-data:/data
    networks:
      - s3-testing
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  # S3-Ferry File Upload Service
  s3-ferry:
    build: "./S3-Ferry"
    container_name: s3-ferry
    ports:
      - "3000:3000"
    depends_on:
      - minio
      - clamav
      - nats
    environment:
      - NODE_ENV=development
      - S3_ENDPOINT_URL=http://host.docker.internal:9000
      - S3_ACCESS_KEY_ID=minioadmin
      - S3_SECRET_ACCESS_KEY=minioadmin
      - S3_REGION=us-east-1
      - S3_DATA_BUCKET_NAME=validated
      - S3_QUARANTINED_BUCKET_NAME=quarantined
      - S3_FLAGGED_BUCKET_NAME=flagged
      - CLAMAV_HOST=clamav
      - CLAMAV_PORT=3310
      - NATS_SERVERS=nats://nats:4222
    networks:
      - s3-testing
    volumes:
      - ./DSL/S3-ferry/application.yml:/api/config/application.yml
    restart: unless-stopped

  # S3-Ferry Demo UI
  gui:
    build:
      context: ./GUI
      dockerfile: Dockerfile.dev
    container_name: s3-ferry-gui
    ports:
      - "3003:3003"
    depends_on:
      - ruuter-private
      - s3-ferry
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_RUUTER_PRIVATE_URL=http://localhost:8088/s3-testing
    volumes:
      - ./GUI:/app
      - /app/node_modules
      - /app/.next
    networks:
      - s3-testing
    restart: unless-stopped

  # Prometheus - Metrics collection and storage
  prometheus:
    image: prom/prometheus:latest
    container_name: buerokratt-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    networks:
      - s3-testing
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Grafana - Metrics visualization and dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: buerokratt-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3001
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - ./grafana-data:/var/lib/grafana
      - ./config/grafana-provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - s3-testing
    restart: unless-stopped

volumes:
  clamav-db:
  prometheus-data:
  grafana-data:

networks:
  s3-testing:
    driver: bridge
  
